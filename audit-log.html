<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
<meta name="robots" content="noindex, nofollow">
<title>Aromati | History</title>

<!-- Access is enforced by Supabase RLS; this page only renders returned rows. -->

<link rel="stylesheet" href="admin.css">
</head>

<body>

<noscript>
  <p class="noscript">The history page needs JavaScript, but the public site does not.
  If you are reading this on the live site, everything a visitor sees is still
  working.</p>
</noscript>

<!-- Sign-in gate -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="signInForm" autocomplete="on">
    <h1 class="gate__title">Aromati</h1>
    <p class="gate__sub">Sign in to see the history.</p>

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" id="email" name="email"
             autocomplete="username" required>
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" type="password" id="password" name="password"
             autocomplete="current-password" required>
    </label>

    <button class="btn btn--primary btn--wide" type="submit" id="signInBtn">Sign in</button>

    <p class="msg" id="gateMsg" role="alert" hidden></p>
  </form>
</div>

<!-- Audit log -->
<div class="app app--log" id="app" hidden>

  <header class="topbar">
    <span class="topbar__brand">
      <img src="assets/logos/aromati-lockup.svg" alt="Aromati café wine bar">
    </span>
    <span class="topbar__who" id="who"></span>
    <span class="topbar__spacer"></span>
    <span class="topbar__msg" id="logMsg" role="status" hidden></span>
    <a class="topbar__link" href="admin.html"><span>The editor</span><span class="topbar__link-go" aria-hidden="true">↗</span></a>
    <button class="btn btn--quiet" type="button" id="refreshBtn"><span>Refresh</span></button>
    <button class="btn btn--quiet" type="button" id="signOut"><span>Sign out</span></button>
  </header>

  <main class="logmain">
    <div class="logmain__scroll">
      <h1 class="logmain__title">History</h1>

      <!-- Filters apply to the loaded rows; they do not query the database. -->
      <div class="logfilter">
        <div class="logfilter__field">
          <span class="logfilter__label" id="actorFilterLabel">Who</span>
          <div class="logfilter__picker" id="actorFilterPicker">
            <select class="logfilter__input" id="actorFilter" aria-hidden="true" tabindex="-1">
              <option value="">Everyone</option>
            </select>
            <button class="logfilter__input logfilter__select-toggle" type="button"
                    id="actorFilterToggle" aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="actorFilterMenu" aria-labelledby="actorFilterLabel actorFilterText">
              <span id="actorFilterText">Everyone</span>
              <span class="logfilter__select-chevron" aria-hidden="true"></span>
            </button>
            <div class="logfilter__menu" id="actorFilterMenu" role="listbox"
                 aria-labelledby="actorFilterLabel" hidden></div>
          </div>
        </div>
        <div class="logfilter__field">
          <span class="logfilter__label" id="dateFilterLabel">When</span>
          <div class="logfilter__picker" id="dateFilterPicker">
            <select class="logfilter__input" id="dateFilter" aria-hidden="true" tabindex="-1">
              <option value="">Any time</option>
              <option value="today">Today</option>
              <option value="yesterday">Yesterday</option>
              <option value="week">The last 7 days</option>
              <option value="month">The last 30 days</option>
            </select>
            <button class="logfilter__input logfilter__select-toggle" type="button"
                    id="dateFilterToggle" aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="dateFilterMenu" aria-labelledby="dateFilterLabel dateFilterText">
              <span id="dateFilterText">Any time</span>
              <span class="logfilter__select-chevron" aria-hidden="true"></span>
            </button>
            <div class="logfilter__menu" id="dateFilterMenu" role="listbox"
                 aria-labelledby="dateFilterLabel" hidden></div>
          </div>
        </div>
        <div class="logfilter__field logfilter__field--day">
          <label class="logfilter__label" for="dayFilter">On a day</label>
          <span class="logfilter__date" id="dayFilterWrap">
            <input class="logfilter__input" type="date" id="dayFilter"
                   aria-haspopup="dialog" aria-controls="dayPicker" aria-expanded="false">
            <span class="logfilter__date-value" id="dayFilterText" aria-hidden="true">Select a date</span>
            <span class="logfilter__date-icon" aria-hidden="true"></span>
          </span>
          <div class="daypicker" id="dayPicker" role="dialog" aria-label="Choose a date" hidden>
            <div class="daypicker__head">
              <button class="daypicker__nav" type="button" id="dayPickerPrev" aria-label="Previous month">‹</button>
              <strong class="daypicker__month" id="dayPickerMonth"></strong>
              <button class="daypicker__nav" type="button" id="dayPickerNext" aria-label="Next month">›</button>
            </div>
            <div class="daypicker__weekdays" aria-hidden="true">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
              <span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="daypicker__grid" id="dayPickerGrid"></div>
            <div class="daypicker__actions">
              <button class="daypicker__action daypicker__action--quiet" type="button" id="dayPickerClear">Clear</button>
              <span class="daypicker__actions-right">
                <button class="daypicker__action daypicker__action--quiet" type="button" id="dayPickerCancel">Cancel</button>
                <button class="daypicker__action daypicker__action--done" type="button" id="dayPickerDone" disabled>Done</button>
              </span>
            </div>
          </div>
        </div>
        <button class="logfilter__attention" type="button" id="attentionBtn"
                aria-pressed="false"><span>Unsaved changes</span></button>
      </div>

      <!-- On small screens, tabs switch between the two log columns. -->
      <div class="logtabs" role="tablist">
        <button class="logtabs__tab is-on" type="button" id="tabChanges" role="tab"
                aria-selected="true"><span>Changes</span> <span id="tabChangeCount"></span></button>
        <button class="logtabs__tab" type="button" id="tabSessions" role="tab"
                aria-selected="false"><span>Sessions</span> <span id="tabSessionCount"></span></button>
      </div>

      <!-- Session activity is kept separate from content changes. -->
      <div class="logcols">
        <section class="logcol logcol--main">
          <h2 class="logcol__title">Changes <span class="logcol__count" id="changeCount"></span></h2>
          <div class="loglist loglist--main" id="loglist"></div>
        </section>
        <aside class="logcol logcol--sessions">
          <h2 class="logcol__title">Sessions <span class="logcol__count" id="sessionCount"></span></h2>
          <div class="loglist loglist--sessions" id="sessionlist"></div>
        </aside>
      </div>
    </div>
  </main>

</div>

<!-- Loading state -->
<div class="boot" id="boot">
  <p class="boot__text" id="bootText">Opening the history…</p>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="audit-log.js"></script>

</body>
</html>
