<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aromati | Editor</title>

<!--
  The editor. One page, one owner, no framework.

  This page is deliberately plain. It shares no stylesheet with the site: the
  public pages carry an inlined-font arrangement that stops the nav shifting on
  navigation (memory.md, the ⛔ section at the top), and the surest way not to
  break it is not to touch it. admin.css is its own small file.

  Three scripts, in this order and no others:

    config.js       which project, and the publishable key
    vendor/…        the Supabase SDK, checked into this repository
    admin.js        everything else

  vendor/ rather than a CDN because this is the page that holds the owner's
  session token: a script tag pointing at someone else's server here is a
  standing offer to read that token. The Content-Security-Policy for this path
  in _headers says script-src 'self', so it is also enforced rather than merely
  intended. See vendor/README.md.

  There is no inline script and no style attribute anywhere below, for the same
  reason — the policy would drop them, and tools/check-csp.mjs fails the build
  if one appears.
-->

<link rel="stylesheet" href="admin.css">
</head>

<body>

<noscript>
  <p class="noscript">The editor needs JavaScript. The site itself does not —
  if you are reading this on the live site, everything a visitor sees is
  working.</p>
</noscript>

<!-- ── the gate ─────────────────────────────────────────────────────────── -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="signInForm" autocomplete="on">
    <h1 class="gate__title">Aromati</h1>
    <p class="gate__sub">Sign in to edit the site.</p>

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" id="email" name="email"
             autocomplete="username" required>
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" type="password" id="password" name="password"
             autocomplete="current-password" required>
    </label>

    <button class="btn btn--primary btn--wide" type="submit" id="signInBtn">Sign in</button>

    <p class="msg" id="gateMsg" role="alert" hidden></p>

    <p class="gate__foot">There is one account, and it is yours. If the
      password has been forgotten, it is reset from the Supabase dashboard —
      there is no reset link here on purpose.</p>
  </form>
</div>

<!-- ── the editor ───────────────────────────────────────────────────────── -->
<!--
  Three panes, and only the panes scroll.

    rail    which of the six areas
    index   which section inside that area — a flat list, nothing folds
    editor  that section's fields, already open, with the savebar at its foot

  The shell is a grid that fills the viewport exactly once; the document itself
  never scrolls. Under 1200px the rail lies down under the topbar; under 900px
  the index and the editor take turns and .shell--editing says which.
-->
<div class="app" id="app" hidden>

  <header class="topbar">
    <span class="topbar__brand">Aromati</span>
    <span class="topbar__who" id="who"></span>
    <span class="topbar__spacer"></span>
    <a class="topbar__link" id="viewSite" href="index.html" target="_blank" rel="noopener"><span>View the site</span><span class="topbar__link-go" aria-hidden="true">↗</span></a>
    <button class="btn btn--quiet" type="button" id="signOut"><span>Sign out</span></button>
  </header>

  <div class="shell" id="shell">

    <nav class="rail" aria-label="Sections">
      <div class="rail__list" id="tabs"></div>
    </nav>

    <aside class="index" id="index" aria-label="Sections in this area">
      <div class="index__head">
        <p class="index__title" id="indexTitle"></p>
        <div class="index__tools" id="indexTools"></div>
      </div>
      <div class="index__list" id="indexList"></div>
      <div class="index__foot" id="indexFoot"></div>
    </aside>

    <main class="editor">
      <div class="editor__scroll" id="panels"></div>
    </main>

    <!-- Both of these are the shell's, not the editor's. Under 900px the index
         and the editor take turns, and a savebar living inside the editor is a
         savebar that disappears the moment the owner goes back to the list —
         with unsaved work still in the draft and nothing on screen saying so.
         They sit in the editor's column at every width that has one. -->
    <div class="problems" id="problems" hidden>
      <h2 class="problems__title" id="problemsTitle"></h2>
      <ul class="problems__list" id="problemsList"></ul>
    </div>

    <!-- What the next save would write, listed rather than counted. It is the
         shell's for the same reason the savebar is, and it sits between the
         two so the count that opens it stays directly underneath.

         Closed, it is `hidden` — not merely collapsed — so nothing inside it
         can be reached by tabbing past the savebar. -->
    <div class="changes" id="changes" hidden>
      <div class="changes__inner">
        <p class="changes__title" id="changesTitle"></p>
        <ul class="changes__list" id="changesList"></ul>
      </div>
    </div>

    <!-- The savebar is the only thing that writes. Nothing above it is live
         until it is used, and Discard puts everything back. -->
    <div class="savebar savebar--clean" id="savebar">
      <span class="savebar__dot" aria-hidden="true"></span>
      <!-- The count is the handle for the list above. It was already the one
           thing on this bar that says how much is waiting, so pressing it is
           the smallest control this could have been. #saveCount stays its own
           element: the caret is a sibling, and the text is written straight
           into the span the way it always was. -->
      <button class="savebar__count" type="button" id="changesToggle"
              aria-expanded="false" aria-controls="changes">
        <span id="saveCount"></span>
        <span class="savebar__caret" aria-hidden="true"></span>
      </button>
      <span class="savebar__spacer"></span>
      <button class="btn btn--ghost"   type="button" id="discardBtn">Discard</button>
      <button class="btn btn--primary" type="button" id="saveBtn">Save changes</button>
    </div>

  </div>

</div>

<!-- ── before either of those ───────────────────────────────────────────── -->
<div class="boot" id="boot">
  <p class="boot__text" id="bootText">Opening the editor…</p>
</div>

<script src="config.js"></script>
<!-- The photograph slots as the site ships with them. The editor needs it for
     two things it cannot get from the database: what a slot looks like before
     anything has been uploaded into it, and the shape of the picture a new one
     would be replacing. Same file the public pages load. -->
<script src="data/seed-photos.js"></script>
<script src="vendor/supabase.js"></script>
<script src="admin.js"></script>

</body>
</html>
